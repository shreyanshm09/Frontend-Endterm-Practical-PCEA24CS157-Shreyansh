<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Travel Gallery</h1>

    <div class="gallery">
      <div class="tile" style="background: linear-gradient(135deg, #38b2ac, #2b6cb0);">Mountain</div>
      <div class="tile" style="background: linear-gradient(135deg, #4fd1c5, #4299e1);">Beach</div>
      <div class="tile" style="background: linear-gradient(135deg, #48bb78, #9ae6b4);">Forest</div>
      <div class="tile" style="background: linear-gradient(135deg, #ed8936, #ecc94b);">Desert</div>
      <div class="tile" style="background: linear-gradient(135deg, #553c9a, #4a5568);">City</div>
      <div class="tile" style="background: linear-gradient(135deg, #00b5d8, #0066ff);">Lake</div>
    </div>
  </main>


  <div id="lightbox" class="lightbox hidden">
    <span id="closeBtn" class="close-btn">&times;</span>
    <div id="lightboxTile" class="lightbox-tile"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
